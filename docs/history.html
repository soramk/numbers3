<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>勝敗履歴 - ナンバーズ3予測ツール</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <script>
        // 【緊急対応】キャッシュ問題を解決するため、一旦ServiceWorkerを解除する
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function (registrations) {
                for (let registration of registrations) {
                    registration.unregister();
                }
            });
        }
    </script>
    <style>
        * {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }

        body {
            background: #111827;
            background-image:
                radial-gradient(circle at 50% 50%, rgba(17, 24, 39, 0.7) 0%, rgba(17, 24, 39, 1) 100%),
                url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%236b7280' fill-opacity='0.1'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2v-4h4v-2h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2v-4h4v-2H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
        }

        @keyframes gradientShift {
            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }
        }

        .glass-card {
            background: rgba(31, 41, 55, 0.8);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }

        .sidebar-link {
            transition: all 0.2s ease;
        }

        .sidebar-link:hover {
            background: rgba(99, 102, 241, 0.1);
            transform: translateX(4px);
        }

        .sidebar-link.active {
            background: rgba(99, 102, 241, 0.15);
            border-left: 3px solid rgb(99, 102, 241);
        }

        .fade-in {
            animation: fadeIn 0.6s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .matching-ball {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            font-weight: bold;
            margin: 0 2px;
        }

        .hit-set {
            background-color: #ef4444;
            color: white;
        }

        .hit-box {
            background-color: #f59e0b;
            color: white;
        }

        .hit-mini {
            background-color: #10b981;
            color: white;
        }

        .no-hit {
            background-color: #e5e7eb;
            color: #4b5563;
        }

        .section-content {
            scroll-margin-top: 100px;
        }

        .sidebar-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 30;
        }

        .sidebar-overlay.open {
            display: block;
        }

        @media (max-width: 768px) {
            .sidebar {
                transform: translateX(-100%);
                transition: transform 0.3s ease;
            }

            .sidebar.open {
                transform: translateX(0);
            }
        }
    </style>
</head>

<body class="min-h-screen">
    <!-- モバイルメニューボタン -->
    <button id="mobileMenuBtn"
        class="fixed top-4 left-4 z-50 md:hidden bg-gray-800/90 backdrop-blur-sm p-3 rounded-lg shadow-lg">
        <svg class="w-6 h-6 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
        </svg>
    </button>

    <!-- サイドバーオーバーレイ（モバイル用） -->
    <div id="sidebarOverlay" class="sidebar-overlay"></div>

    <!-- サイドバー -->
    <aside id="sidebar"
        class="fixed left-0 top-0 h-full w-64 bg-gray-900/95 backdrop-blur-sm shadow-xl z-40 sidebar overflow-y-auto">
        <div class="p-6">
            <div class="mb-8 flex items-center justify-between">
                <div class="flex flex-col items-center">
                    <img src="./public/numberslogo_02.png" alt="NUMBERS3 PREDICT" class="w-48 mb-2">
                </div>
                <button id="closeSidebarBtn" class="md:hidden text-gray-500 hover:text-gray-300">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12">
                        </path>
                    </svg>
                </button>
            </div>

            <nav class="space-y-2">
                <a href="index.html"
                    class="sidebar-link flex items-center gap-3 px-4 py-3 rounded-lg text-gray-300 font-medium">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6">
                        </path>
                    </svg>
                    トップ・統合予測
                </a>
                <a href="history.html"
                    class="sidebar-link active flex items-center gap-3 px-4 py-3 rounded-lg text-gray-300 font-medium">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01">
                        </path>
                    </svg>
                    勝敗履歴
                </a>
                <a href="search/index.html"
                    class="sidebar-link flex items-center gap-3 px-4 py-3 rounded-lg text-gray-300 font-medium">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                    </svg>
                    過去データ検索・分析
                </a>
                <a href="analyzer.html"
                    class="sidebar-link flex items-center gap-3 px-4 py-3 rounded-lg text-gray-300 font-medium">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M11 3.055A9.001 9.001 0 1020.945 13H11V3.055z"></path>
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M20.488 9H15V3.512A9.025 9.025 0 0120.488 9z"></path>
                    </svg>
                    詳細分析ツール
                </a>
            </nav>
        </div>
    </aside>

    <!-- メインコンテンツ -->
    <div class="md:ml-64">
        <div class="w-full max-w-full px-4 py-6 md:py-8">
            <header class="text-center mb-8 fade-in">
                <div class="glass-card rounded-2xl p-6 md:p-8 w-full">
                    <h1 class="text-3xl md:text-4xl font-extrabold mb-2 text-white">
                        勝敗履歴一覧
                    </h1>
                    <p class="text-gray-400">過去の予測と実際の当選番号の照合結果</p>
                </div>
            </header>

            <div id="loading" class="text-center py-20 fade-in">
                <div
                    class="animate-spin rounded-full h-12 w-12 border-4 border-purple-600 border-t-transparent inline-block">
                </div>
                <p class="mt-4 text-white font-medium">履歴データを照合中...</p>
            </div>

            <div id="historyContainer" class="hidden space-y-6 fade-in">
                <!-- 統計カード -->
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8">
                    <div class="glass-card rounded-xl p-5 text-center">
                        <p class="text-sm text-gray-400 font-medium uppercase tracking-wider mb-1">検証回数</p>
                        <p id="statTotal" class="text-3xl font-bold text-white">-</p>
                    </div>
                    <div class="glass-card rounded-xl p-5 text-center">
                        <p class="text-sm text-gray-400 font-medium uppercase tracking-wider mb-1">セット/ボックス的中</p>
                        <p id="statHits" class="text-3xl font-bold text-red-600">-</p>
                    </div>
                    <div class="glass-card rounded-xl p-5 text-center">
                        <p class="text-sm text-gray-400 font-medium uppercase tracking-wider mb-1">ミニ的中</p>
                        <p id="statMiniHits" class="text-3xl font-bold text-green-600">-</p>
                    </div>
                </div>

                <!-- 履歴テーブル -->
                <div class="glass-card rounded-2xl overflow-hidden shadow-xl">
                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse">
                            <thead>
                                <tr class="bg-gray-800/50">
                                    <th class="px-6 py-4 text-sm font-bold text-gray-300 border-b">予測対象日</th>
                                    <th class="px-6 py-4 text-sm font-bold text-gray-300 border-b">当選番号 (結果)</th>
                                    <th class="px-6 py-4 text-sm font-bold text-gray-300 border-b">統合予測（セット）</th>
                                    <th class="px-6 py-4 text-sm font-bold text-gray-300 border-b">統合予測（ミニ）</th>
                                    <th class="px-6 py-4 text-sm font-bold text-gray-300 border-b">判定</th>
                                </tr>
                            </thead>
                            <tbody id="historyTableBody">
                                <!-- JavaScriptで動的に生成 -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="history.js"></script>
    <script>
        // モバイルメニューの開閉
        const mobileMenuBtn = document.getElementById('mobileMenuBtn');
        const sidebar = document.getElementById('sidebar');
        const sidebarOverlay = document.getElementById('sidebarOverlay');
        const closeSidebarBtn = document.getElementById('closeSidebarBtn');

        function openSidebar() {
            sidebar.classList.add('open');
            sidebarOverlay.classList.add('open');
        }

        function closeSidebar() {
            sidebar.classList.remove('open');
            sidebarOverlay.classList.remove('open');
        }

        if (mobileMenuBtn && sidebar) {
            mobileMenuBtn.addEventListener('click', openSidebar);
        }

        if (closeSidebarBtn) {
            closeSidebarBtn.addEventListener('click', closeSidebar);
        }

        if (sidebarOverlay) {
            sidebarOverlay.addEventListener('click', closeSidebar);
        }
    </script>
</body>

</html>
