<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>ナンバーズ3予測ツール</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2.0.1/dist/chartjs-plugin-zoom.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="./public/styles.css">
    <link rel="manifest" href="./manifest.json">
    <script>
        // 【緊急対応】キャッシュ問題を解決するため、一旦ServiceWorkerを解除する
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function (registrations) {
                for (let registration of registrations) {
                    registration.unregister();
                }
            });
        }
    </script>
    <style>
        * {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }

        body {
            background: #111827;
            background-image:
                radial-gradient(circle at 50% 50%, rgba(17, 24, 39, 0.7) 0%, rgba(17, 24, 39, 1) 100%),
                url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%236b7280' fill-opacity='0.1'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2v-4h4v-2h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2v-4h4v-2H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
        }

        .glass-card {
            background: rgba(31, 41, 55, 0.8);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }

        .prediction-card {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .prediction-card:hover {
            transform: translateY(-4px) scale(1.02);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
        }

        .fade-in {
            animation: fadeIn 0.6s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .phase-tab-btn {
            transition: all 0.2s ease;
            cursor: pointer;
        }

        .phase-tab-btn.active {
            color: rgb(79, 70, 229);
            border-bottom: 2px solid rgb(79, 70, 229);
        }

        .phase-tab-btn:hover:not(.active) {
            color: rgb(99, 102, 241);
        }

        .sidebar-link {
            transition: all 0.2s ease;
        }

        .sidebar-link:hover {
            background: rgba(99, 102, 241, 0.1);
            transform: translateX(4px);
        }

        .sidebar-link.active {
            background: rgba(99, 102, 241, 0.15);
            border-left: 3px solid rgb(99, 102, 241);
        }

        .section-content {
            scroll-margin-top: 100px;
        }

        .sidebar-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 30;
        }

        .sidebar-overlay.open {
            display: block;
        }

        @media (max-width: 768px) {
            .sidebar {
                transform: translateX(-100%);
                transition: transform 0.3s ease;
            }

            .sidebar.open {
                transform: translateX(0);
            }
        }
    </style>
</head>

<body class="min-h-screen">
    <!-- モバイルメニューボタン -->
    <button id="mobileMenuBtn"
        class="fixed top-4 left-4 z-50 md:hidden bg-gray-800/90 backdrop-blur-sm p-3 rounded-lg shadow-lg">
        <svg class="w-6 h-6 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
        </svg>
    </button>

    <!-- サイドバーオーバーレイ（モバイル用） -->
    <div id="sidebarOverlay" class="sidebar-overlay"></div>

    <!-- サイドバー -->
    <aside id="sidebar"
        class="fixed left-0 top-0 h-full w-64 bg-gray-900/95 backdrop-blur-sm shadow-xl z-40 sidebar overflow-y-auto">
        <div class="p-6">
            <div class="mb-8 flex items-center justify-between">
                <div class="flex flex-col items-center">
                    <img src="./public/numberslogo_02.png" alt="NUMBERS3 PREDICT" class="w-48 mb-2">
                </div>
                <button id="closeSidebarBtn" class="md:hidden text-gray-500 hover:text-gray-300">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12">
                        </path>
                    </svg>
                </button>
            </div>

            <nav class="space-y-2">
                <a href="#predictions"
                    class="sidebar-link active flex items-center gap-3 px-4 py-3 rounded-lg text-gray-300 font-medium">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z">
                        </path>
                    </svg>
                    統合予測結果
                </a>
                <a href="history.html"
                    class="sidebar-link flex items-center gap-3 px-4 py-3 rounded-lg text-gray-300 font-medium">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01">
                        </path>
                    </svg>
                    勝敗履歴
                </a>
                <a href="#phase-chart"
                    class="sidebar-link flex items-center gap-3 px-4 py-3 rounded-lg text-gray-300 font-medium">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z">
                        </path>
                    </svg>
                    位相推移グラフ
                </a>
                <a href="#methods"
                    class="sidebar-link flex items-center gap-3 px-4 py-3 rounded-lg text-gray-300 font-medium">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z">
                        </path>
                    </svg>
                    予測手法の詳細
                </a>
                <a href="#analysis"
                    class="sidebar-link flex items-center gap-3 px-4 py-3 rounded-lg text-gray-300 font-medium">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z">
                        </path>
                    </svg>
                    詳細分析結果
                </a>
                <a href="search/index.html"
                    class="sidebar-link flex items-center gap-3 px-4 py-3 rounded-lg text-gray-300 font-medium">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                    </svg>
                    過去データ検索・分析
                </a>
            </nav>

            <div class="mt-8 pt-8 border-t border-gray-200">
                <a href="analyzer.html"
                    class="flex items-center gap-2 px-4 py-2 bg-gradient-to-r from-purple-500 to-indigo-500 text-white rounded-lg font-semibold hover:from-purple-600 hover:to-indigo-600 transition-all duration-300 text-sm">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z">
                        </path>
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                    </svg>
                    詳細分析ツール
                </a>
            </div>
        </div>
    </aside>

    <!-- メインコンテンツ -->
    <div class="md:ml-64">
        <div class="w-full max-w-full px-4 py-6 md:py-8">
            <!-- ヘッダー -->
            <header class="text-center mb-8 md:mb-12 fade-in">
                <div class="glass-card rounded-2xl p-6 md:p-8 mb-6 w-full flex flex-col items-center">
                    <img src="./public/numberslogo_02.png" alt="NUMBERS3 PREDICT" class="w-full max-w-md mb-6">
                    <div class="flex gap-3 justify-center flex-wrap">
                        <a href="analyzer.html"
                            class="inline-flex items-center gap-2 px-5 py-2.5 bg-gradient-to-r from-purple-500 to-indigo-500 text-white rounded-xl font-semibold hover:from-purple-600 hover:to-indigo-600 transition-all duration-300 shadow-lg hover:shadow-xl">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z">
                                </path>
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                            </svg>
                            詳細分析ツール
                        </a>
                    </div>
                </div>
            </header>

            <!-- ローディング表示 -->
            <div id="loading" class="text-center py-20 fade-in">
                <div class="inline-block relative">
                    <div class="absolute inset-0 rounded-full border-4 border-purple-200 animate-ping"></div>
                    <div
                        class="relative inline-block animate-spin rounded-full h-16 w-16 border-4 border-purple-600 border-t-transparent">
                    </div>
                </div>
                <p class="mt-6 text-lg font-medium text-white drop-shadow-lg">予測データを読み込み中...</p>
            </div>

            <!-- エラー表示 -->
            <div id="error" class="hidden glass-card rounded-xl p-5 mb-6 border-l-4 border-red-500 fade-in">
                <div class="flex items-center gap-3">
                    <svg class="w-6 h-6 text-red-500 flex-shrink-0" fill="none" stroke="currentColor"
                        viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                    </svg>
                    <p id="errorMessage" class="text-red-700 font-medium"></p>
                </div>
            </div>

            <!-- メインコンテンツ -->
            <div id="content" class="hidden space-y-6">
                <!-- ヘッダー -->
                <header class="text-center mb-6 fade-in">
                    <div class="glass-card rounded-2xl p-6 w-full flex flex-col items-center">
                        <img src="./public/numberslogo_02.png" alt="NUMBERS3 PREDICT" class="w-64 mb-2">
                    </div>
                </header>

                <!-- 履歴選択 -->
                <div class="glass-card rounded-2xl p-5 md:p-6 fade-in w-full">
                    <div class="flex flex-col md:flex-row md:items-end md:justify-between gap-4">
                        <div class="flex-1">
                            <label for="historySelect"
                                class="block text-sm font-semibold text-gray-300 mb-2.5 flex items-center gap-2">
                                <svg class="w-4 h-4 text-purple-600" fill="none" stroke="currentColor"
                                    viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z">
                                    </path>
                                </svg>
                                予測履歴を選択
                            </label>
                            <select id="historySelect"
                                class="w-full px-4 py-3 bg-gray-800 border-2 border-gray-700 rounded-xl focus:ring-2 focus:ring-purple-500 focus:border-purple-500 transition-all duration-200 font-medium text-gray-300 shadow-sm hover:border-purple-600">
                                <option value="latest">最新の予測</option>
                            </select>
                        </div>
                        <div class="flex gap-4 md:gap-8">
                            <div class="text-center md:text-left">
                                <p class="text-xs font-medium text-gray-500 uppercase tracking-wide mb-1">最終更新</p>
                                <p id="lastUpdate" class="text-base md:text-lg font-bold text-white"></p>
                            </div>
                            <div class="text-center md:text-right">
                                <p class="text-xs font-medium text-gray-500 uppercase tracking-wide mb-1">データ件数</p>
                                <p id="totalRecords" class="text-base md:text-lg font-bold text-white"></p>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 統合予測結果 -->
                <div id="predictions" class="glass-card rounded-2xl p-6 md:p-8 fade-in section-content w-full">
                    <div class="flex items-center gap-3 mb-6">
                        <div
                            class="w-12 h-12 rounded-xl bg-gradient-to-br from-purple-500 to-pink-600 flex items-center justify-center shadow-lg">
                            <span class="text-white font-bold text-xl">🎯</span>
                        </div>
                        <div>
                            <h2 class="text-2xl md:text-3xl font-bold text-white">統合予測結果</h2>
                            <p class="text-sm text-gray-400 mt-0.5">全手法を統合した予測（重み付き平均）</p>
                        </div>
                    </div>
                    <div class="space-y-8">
                        <!-- セット予測（一段目） -->
                        <div>
                            <h3 class="text-lg font-semibold text-gray-300 mb-4 flex items-center gap-2">
                                <span
                                    class="w-8 h-8 rounded-lg bg-gradient-to-br from-blue-500 to-indigo-600 flex items-center justify-center text-white font-bold text-sm">S</span>
                                セット予測（3桁）
                            </h3>
                            <div id="setPredictions"
                                class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-5 gap-4"></div>
                        </div>
                        <!-- ミニ予測（二段目） -->
                        <div>
                            <h3 class="text-lg font-semibold text-gray-300 mb-4 flex items-center gap-2">
                                <span
                                    class="w-8 h-8 rounded-lg bg-gradient-to-br from-green-500 to-emerald-600 flex items-center justify-center text-white font-bold text-sm">M</span>
                                ミニ予測（下2桁）
                            </h3>
                            <div id="miniPredictions"
                                class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-5 gap-4"></div>
                        </div>
                    </div>
                </div>

                <!-- 位相グラフ -->
                <div id="phase-chart" class="glass-card rounded-2xl p-6 md:p-8 fade-in section-content w-full">
                    <h2 class="text-2xl md:text-3xl font-bold text-white mb-6 flex items-center gap-3">
                        <svg class="w-8 h-8 text-purple-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z">
                            </path>
                        </svg>
                        位相推移グラフ
                    </h2>
                    <!-- タブ切り替え -->
                    <div class="mb-4 flex gap-2 border-b border-gray-200">
                        <button
                            class="phase-tab-btn active px-4 py-2 text-sm font-semibold text-indigo-600 border-b-2 border-indigo-600 transition-colors"
                            data-pos="hundred">
                            百の位
                        </button>
                        <button
                            class="phase-tab-btn px-4 py-2 text-sm font-semibold text-gray-400 hover:text-indigo-600 transition-colors"
                            data-pos="ten">
                            十の位
                        </button>
                        <button
                            class="phase-tab-btn px-4 py-2 text-sm font-semibold text-gray-400 hover:text-indigo-600 transition-colors"
                            data-pos="one">
                            一の位
                        </button>
                        <button
                            class="phase-tab-btn px-4 py-2 text-sm font-semibold text-gray-400 hover:text-indigo-600 transition-colors"
                            data-pos="all">
                            全て表示
                        </button>
                    </div>
                    <div class="h-96 md:h-[500px] bg-gray-900 rounded-xl p-4 shadow-inner">
                        <canvas id="phaseChart"></canvas>
                    </div>
                </div>

                <!-- 予測手法の詳細 -->
                <div id="methods" class="glass-card rounded-2xl p-6 md:p-8 fade-in section-content w-full">
                    <h2 class="text-2xl md:text-3xl font-bold text-white mb-6 flex items-center gap-3">
                        <svg class="w-8 h-8 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z">
                            </path>
                        </svg>
                        予測手法の詳細
                    </h2>
                    <div id="methodDetails" class="space-y-4"></div>
                </div>

                <!-- 詳細分析結果 -->
                <div id="analysis" class="glass-card rounded-2xl p-6 md:p-8 fade-in section-content w-full">
                    <h2 class="text-2xl md:text-3xl font-bold text-white mb-6 flex items-center gap-3">
                        <svg class="w-8 h-8 text-purple-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z">
                            </path>
                        </svg>
                        詳細分析結果
                    </h2>
                    <div class="space-y-4">
                        <!-- 相関分析 -->
                        <div class="bg-gray-800/60 backdrop-blur-sm rounded-xl p-4 border border-gray-700">

    <script>
        // モバイルメニューの開閉
        const mobileMenuBtn = document.getElementById('mobileMenuBtn');
        const sidebar = document.getElementById('sidebar');
        const sidebarOverlay = document.getElementById('sidebarOverlay');
        const closeSidebarBtn = document.getElementById('closeSidebarBtn');

        function openSidebar() {
            sidebar.classList.add('open');
            sidebarOverlay.classList.add('open');
        }

        function closeSidebar() {
            sidebar.classList.remove('open');
            sidebarOverlay.classList.remove('open');
        }

        if (mobileMenuBtn && sidebar) {
            mobileMenuBtn.addEventListener('click', openSidebar);
        }

        if (closeSidebarBtn) {
            closeSidebarBtn.addEventListener('click', closeSidebar);
        }

        if (sidebarOverlay) {
            sidebarOverlay.addEventListener('click', closeSidebar);
        }

        // サイドバーリンクのクリック処理
        document.querySelectorAll('.sidebar-link').forEach(link => {
            link.addEventListener('click', (e) => {
                const href = link.getAttribute('href');
                // ページ内リンク(#始まり)のみスムーズスクロールを適用
                if (href.startsWith('#')) {
                    e.preventDefault();
                    const targetId = href.substring(1);
                    const targetElement = document.getElementById(targetId);

                    if (targetElement) {
                        // アクティブ状態を更新
                        document.querySelectorAll('.sidebar-link').forEach(l => l.classList.remove('active'));
                        link.classList.add('active');

                        // スムーズスクロール
                        targetElement.scrollIntoView({ behavior: 'smooth', block: 'start' });

                        // モバイルでメニューを閉じる
                        if (window.innerWidth < 768) {
                            sidebar.classList.remove('open');
                        }
                    }
                }
            });
        });

        // スクロール時にアクティブなセクションを更新
        const sections = document.querySelectorAll('.section-content');
        const sidebarLinks = document.querySelectorAll('.sidebar-link');

        function updateActiveSection() {
            let current = '';
            sections.forEach(section => {
                const sectionTop = section.offsetTop;
                const sectionHeight = section.clientHeight;
                if (window.scrollY >= (sectionTop - 150)) {
                    current = section.getAttribute('id');
                }
            });

            sidebarLinks.forEach(link => {
                link.classList.remove('active');
                if (link.getAttribute('href').substring(1) === current) {
                    link.classList.add('active');
                }
            });
        }

        window.addEventListener('scroll', updateActiveSection);
        updateActiveSection(); // 初期状態を設定
    </script>
